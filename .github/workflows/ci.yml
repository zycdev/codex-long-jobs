name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck tmux
          python -m pip install ruff==0.16.0 pyyaml==6.0.3
      - name: Lint and format check
        run: |
          ruff check scripts/codex_long_jobs.py tests
          ruff format --check scripts/codex_long_jobs.py tests
      - name: Validate Skill frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          text = Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n")
          frontmatter = yaml.safe_load(text.split("---\n", 2)[1])
          assert frontmatter["name"] == "codex-long-jobs"
          assert set(frontmatter) == {"name", "description"}
          PY
      - name: Run integration tests
        run: scripts/smoke_test.sh
      - name: Check shell entrypoints
        run: shellcheck scripts/codex-long-jobs scripts/*.sh
      - name: Measure subprocess branch coverage
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install coverage==7.15.3
          scripts/coverage_test.sh
